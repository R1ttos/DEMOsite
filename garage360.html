const bz=(d,h,m)=>{const t=new Date();if(dk(d)==dk(t)&&h<=t.getHours())return 1;const f=k=>(d.getDate()*7+h*3+k*5)%4==0||(d.getDate()+h+k)%6==0;return m>=0?f(m):[0,1,2].filter(f).length>1};

if(st==2)h+=[{n:'Автоматичний підбір',s:'Найближчий вільний майстер'},...M].map((m,i)=>`<label class="ck"><input type="radio" name="m" ${B.m==i-1?'checked':''} onchange="B.m=${i-1};B.time=null"><span><b>${m.n}</b><br><small class="dot">${m.s}</small></span></label>`).join('');
if(st==3){const hr=B.date?D.hours[new Date(B.date).getDay()]:null;h+=`<div class="dg">${days().map(d=>{const off=!D.hours[d.getDay()];return `<button class="${B.date==dk(d)?'on':''}" ${off?'disabled':''} onclick="B.date='${dk(d)}';B.time=null;bk()">${DN[d.getDay()]}<br>${dl(d)}</button>`}).join('')}</div>`;
if(hr){const d=new Date(B.date),a=[];for(let x=hr[0];x<hr[1];x++)a.push(x);h+=`<div class="tg">${a.map(x=>{const t=String(x).padStart(2,'0')+':00';return `<button class="${B.time==t?'on':''}" ${bz(d,x,B.m)?'disabled':''} onclick="B.time='${t}';bk()">${t}</button>`}).join('')}</div>`}else h+='<p class="dot">Оберіть дату. Неділя — вихідний, закреслені слоти зайняті.</p>'}

function nx(d){const s=B.step;if(d<0)return bk(s-1);const e=[()=>!B.make||!B.model||!B.year?'Заповніть марку, модель і рік':'',()=>B.svc.length?'':'Оберіть хоча б одну послугу',()=>'',()=>B.date&&B.time?'':'Оберіть дату та вільний час',()=>!B.name.trim()?'Вкажіть ім’я':B.phone.replace(/\D/g,'').length<10?'Вкажіть коректний телефон':'',()=>''][s]();
if(e){$('#er').textContent=e;return}if(s<5)return bk(s+1);
const id='G360-'+Math.floor(10000+Math.random()*89999),a=ls('g360_bk')||[],dd=B.date.split('-');a.push({id,car:`${B.make} ${B.model}`,svc:B.svc.map(i=>S[i].n).join(', '),master:B.m<0?'авто-підбір':M[B.m].n,date:`${dd[2]}.${dd[1]}`,time:B.time,total:tot(),iso:B.date,name:B.name,phone:B.phone});ls('g360_bk',a);

const U=()=>ls('g360_u'),fd=s=>s.split('-').reverse().join('.'),nk=n=>n.toLocaleString('uk-UA')+' км';
function acc(){U()?cab():show(`<h3>Вхід у кабінет (демо)</h3><p class="dot">Введіть будь-який номер і демо-код 123456. SMS не надсилається.</p><label>Телефон</label><input id="lp" type="tel" placeholder="+380…"><label>Код</label><input id="lc" inputmode="numeric" placeholder="123456"><div class="er" id="er"></div><div class="row"><button class="btn o" onclick="cl()">Закрити</button><button class="btn" onclick="lg()">Увійти</button></div>`)}
